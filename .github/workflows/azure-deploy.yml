name: OptiDrive Azure Deploy

permissions:
  contents: read

concurrency:
  group: optidrive-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "OptiDrive CI" ]
    types: [ completed ]
    branches: [ main, master ]

jobs:
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore OptiDrive.sln

      - name: Publish web application
        run: dotnet publish OptiDrive.Web/OptiDrive.Web.csproj --configuration Release --output artifacts/azure-publish /p:UseAppHost=false

      - name: Check Azure deployment configuration
        id: azure-config
        shell: bash
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [[ -n "$AZURE_WEBAPP_NAME" && -n "$AZURE_WEBAPP_PUBLISH_PROFILE" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure deployment skipped: configure AZURE_WEBAPP_NAME and AZURE_WEBAPP_PUBLISH_PROFILE in the production environment."
          fi

      - name: Deploy package to Azure Web App
        if: steps.azure-config.outputs.configured == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifacts/azure-publish
